<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凤持天规 · 女帝御览</title><style>:root{color-scheme:dark;--bg:#101a25;--panel:#1c2a38;--card:#283a49;--gold:#d8b782;--ink:#f2e3cb;--muted:#b1c0ce}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#27394a,#101a25 65%);font:15px/1.6 system-ui,'PingFang SC',sans-serif;color:var(--ink)}main{max-width:850px;margin:auto;padding:22px 14px 70px}header{text-align:center;padding:24px 0 20px}h1{font-family:serif;font-size:35px;letter-spacing:.24em;color:var(--gold);margin:8px}h2{font-size:19px;color:var(--gold)}small,.muted{color:var(--muted)}.panel,.card{background:var(--panel);border:1px solid #465261;border-radius:17px;padding:18px;margin:13px 0;box-shadow:0 8px 24px #0002}.card{background:var(--card)}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{border:1px solid #8a775d;background:#394858;color:var(--ink);border-radius:10px;padding:10px;cursor:pointer}button.active,button.primary{background:#8d6d40;color:#fff5df}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar{height:9px;border-radius:10px;background:#526170;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#a47d48,#e6c994)}textarea{width:100%;min-height:170px;background:#101d29;color:#f4e4cd;border:1px solid #687380;border-radius:10px;padding:12px;font:13px/1.5 monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:10px 0}.warning{color:#f2bf86}.ok{color:#9fd4b0}.hidden{display:none}.pill{border:1px solid #8d795c;border-radius:20px;padding:2px 9px;font-size:12px;color:#e6c58e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;background:var(--card);padding:12px;border-radius:10px}.stat strong{display:block;font-size:25px;color:var(--gold)}a{color:#e4c58c}input{accent-color:#c9a56e}footer{text-align:center;color:#93a2ae;font-size:12px;margin-top:25px}</style></head><body><main><header><small>✦ 宁昭朝 · 内廷司录 ✦</small><h1>凤持天规</h1><div class="muted">女 帝 御 览 · 私 人 存 档</div></header><nav id="nav"><button class="active" data-tab="overview">御前总览</button><button data-tab="palace">六宫名录</button><button data-tab="outside">宫外情缘</button><button data-tab="archive">十日秘档</button><button data-tab="sync">同步档案</button><button data-tab="settings">存档管理</button></nav><section id="view" class="panel"></section><footer>本地原型 · 数据仅保存在当前浏览器 · 尚未接入账号和云端</footer></main><script>
const KEY='fengchi_demo_v1';const empty=()=>({version:1,world:{name:'未命名女帝世界',date:'尚未设定',location:'尚未设定'},characters:[],archives:[],events:[],revision:0});let state;try{state=JSON.parse(localStorage.getItem(KEY))||empty()}catch{state=empty()}let tab='overview',candidate=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'待核对').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>localStorage.setItem(KEY,JSON.stringify(state));const allowed=['palace','outside'];const normalize=(d)=>{if(!d||typeof d!=='object'||!d.world||!Array.isArray(d.characters)||!Array.isArray(d.archives))throw Error('需要 world、characters、archives 字段');if(d.characters.length>200||d.archives.length>500)throw Error('数据条目过多');let ids=new Set();const characters=d.characters.map(c=>{if(!c.id||!c.name||!allowed.includes(c.type)||ids.has(c.id))throw Error('人物 id、name、type 缺失或重复');ids.add(c.id);if(c.affection!==null&&c.affection!==undefined&&(!Number.isInteger(c.affection)||c.affection<0||c.affection>100))throw Error('好感度必须为 0–100 整数或 null');return {id:String(c.id).slice(0,80),name:String(c.name).slice(0,100),type:c.type,rank:String(c.rank??'待核对').slice(0,100),home:String(c.home??'待核对').slice(0,100),affection:c.affection??null,status:String(c.status??'待核对').slice(0,120),note:String(c.note??'').slice(0,1000)}});const aids=new Set();const archives=d.archives.map(a=>{if(!a.id||aids.has(a.id))throw Error('旬档 id 缺失或重复');aids.add(a.id);return{id:String(a.id).slice(0,80),period:String(a.period??'待核对').slice(0,120),summary:String(a.summary??'').slice(0,3000)}});return{version:1,world:{name:String(d.world.name??'未命名女帝世界').slice(0,100),date:String(d.world.date??'待核对').slice(0,100),location:String(d.world.location??'待核对').slice(0,100)},characters,archives,events:Array.isArray(d.events)?d.events.slice(0,500).map(x=>String(x).slice(0,500)):[],revision:state.revision+1}};
const card=c=>`<div class="card"><div class="row"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.rank)} · ${esc(c.home)}</div></div><span class="pill">${esc(c.status)}</span></div>${c.affection===null?'<p class="muted">元年不启用数值好感度</p>':`<div class="row"><small>好感度</small><b>${c.affection}/100</b></div><div class="bar"><div class="fill" style="width:${c.affection}%"></div></div>`}${c.note?`<small>${esc(c.note)}</small>`:''}</div>`;
function diff(a,b){let out=[];for(const c of b.characters){let old=a.characters.find(x=>x.id===c.id);if(!old){out.push('新增人物：'+c.name);continue}for(const k of ['name','type','rank','home','affection','status','note'])if(old[k]!==c[k])out.push(c.name+' · '+({name:'姓名',type:'归属',rank:'位分/身份',home:'住所/行踪',affection:'好感度',status:'关系',note:'近况'}[k])+'：'+(old[k]??'待核对')+' → '+(c[k]??'待核对'))}for(const c of a.characters)if(!b.characters.some(x=>x.id===c.id))out.push('移除人物：'+c.name);for(const x of b.archives)if(!a.archives.some(y=>y.id===x.id))out.push('新增旬档：'+x.id);for(const x of a.archives)if(!b.archives.some(y=>y.id===x.id))out.push('移除旬档：'+x.id);for(const k of ['name','date','location'])if(a.world[k]!==b.world[k])out.push('世界信息 '+k+'：'+a.world[k]+' → '+b.world[k]);return out}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';if(tab==='overview')html=`<h2>御前总览</h2><div class="grid"><div class="stat"><strong>${state.characters.filter(x=>x.type==='palace').length}</strong><small>在宫人物</small></div><div class="stat"><strong>${state.characters.filter(x=>x.type==='outside').length}</strong><small>宫外情缘</small></div><div class="stat"><strong>${state.archives.length}</strong><small>已封存旬档</small></div></div><div class="card"><b>${esc(state.world.name)}</b><p>日期：${esc(state.world.date)}<br>地点：${esc(state.world.location)}</p><small>存档版本 ${state.revision} · 当前设备本地保存</small></div><button class="primary" data-go="sync">导入 DeepSeek 御览数据</button>`;if(tab==='palace'||tab==='outside'){let arr=state.characters.filter(x=>x.type===tab);html=`<h2>${tab==='palace'?'六宫名录':'宫外情缘录'}</h2>`+(arr.length?arr.map(card).join(''):'<p class="muted">暂无人物档案，请先导入同步数据。</p>')}if(tab==='archive')html=`<h2>十日秘档 <span class="pill">默认封存</span></h2><p class="muted">仅在主动进入此栏目时查看。网站不会自动把秘档当作女帝已知情报。</p>`+(state.archives.length?state.archives.map(a=>`<details class="card"><summary>${esc(a.id)} · ${esc(a.period)}</summary><p>${esc(a.summary)}</p></details>`).join(''):'<p>暂无已结算旬档。</p>');if(tab==='sync')html=`<h2>御览同步 · 预览后确认</h2><p class="muted">DeepSeek 同步链接打开后会自动预览变化；也可手动粘贴 JSON。无需上传完整聊天。仅保存到当前浏览器。</p><p class="muted">链接格式：本站网址#update=加上网址编码后的完整 JSON。长链接可能被 DeepSeek 截断，无法同步时请改用粘贴导入。</p><textarea id="payload" placeholder="粘贴 JSON 数据"></textarea><p><button id="preview" class="primary">解析并预览变化</button></p><div id="preview-area"></div>`;if(tab==='settings')html=`<h2>存档管理</h2><p>当前版本：${state.revision}</p><p><button id="export">导出 JSON 备份</button> <button id="sample">加载演示人物</button></p><p class="warning">演示人物仅供测试，加载会替换当前本地存档。</p><p><button id="reset">清空本地存档</button></p>`;$('#view').innerHTML=html;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});if(tab==='sync')$('#preview').onclick=()=>{const area=$('#preview-area');try{let raw=$('#payload').value;if(raw.length>200000)throw Error('同步数据超过 200KB');candidate=normalize(JSON.parse(raw));const lines=diff(state,candidate);const removed=state.characters.filter(x=>!candidate.characters.some(y=>y.id===x.id));if(removed.length)lines.push('注意：本次完整快照未包含 '+removed.map(x=>x.name).join('、')+'，确认后这些人物将从本地档案移除');area.innerHTML=`<div class="card"><h2>待确认变更</h2>${lines.length?'<ul>'+lines.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':'<p>没有人物或世界信息变化</p>'}<p>人物总数：${candidate.characters.length} · 旬档：${candidate.archives.length}</p><label><input type="checkbox" id="approve"> 我已核对变更并确认替换本地档案</label><button id="commit" class="primary" disabled>确认保存</button></div>`;$('#approve').onchange=e=>$('#commit').disabled=!e.target.checked;$('#commit').onclick=()=>{state=candidate;persist();candidate=null;tab='overview';render();alert('已保存到当前浏览器的本地存档')}}catch(e){area.innerHTML='<p class="warning">无法解析：'+esc(e.message)+'</p>'}};if(tab==='settings'){$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fengchi-save.json';a.click();URL.revokeObjectURL(url)};$('#sample').onclick=()=>{if(confirm('覆盖本地存档并载入演示数据？')){state=normalize({world:{name:'景和 · 女帝世界',date:'景和元年 三月初十',location:'紫宸殿'},characters:[{id:'p1',name:'玄澈',type:'outside',rank:'奉安寺高僧',home:'奉安寺',affection:null,status:'元年·信任待记录'},{id:'o1',name:'萧子瑜',type:'outside',rank:'宗室皇子',home:'皇子府',affection:null,status:'元年·关系待记录'}],archives:[{id:'旬一',period:'三月初一至初十',summary:'演示秘档：宫内外人物按各自轨迹活动。'}]});persist();render()}};$('#reset').onclick=()=>{if(confirm('确认清空当前设备上的全部原型存档？')){state=empty();persist();render()}}}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();if(location.hash.startsWith('#sync=')||location.hash.startsWith('#update=')){try{const modern=location.hash.startsWith('#update=');const encoded=location.hash.slice(modern?8:6);if(encoded.length>30000)throw Error('链接数据过长');let json;if(modern){json=decodeURIComponent(encoded)}else{const bytes=Uint8Array.from(atob(encoded.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));json=new TextDecoder().decode(bytes)};tab='sync';render();$('#payload').value=json;$('#preview').click();history.replaceState(null,'',location.pathname+location.search)}catch(e){alert('同步链接无法解析，请使用手动导入：'+e.message)}}</script></body></html>
